<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 2400px; background: #06080C; color: #FFFFFF; font-family: 'Inter', sans-serif;
      overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
    }
    .ambient-glow-top {
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 1000px; height: 800px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, rgba(226, 125, 141, 0.12) 45%, transparent 75%);
      pointer-events: none; z-index: 0;
    }
    
    .phone-container {
      position: relative; z-index: 2; width: 980px; height: 2260px; background: #0E131C;
      border-radius: 76px; border: 7px solid #283344;
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.95), 0 0 0 2px rgba(212, 175, 55, 0.4), 0 0 80px rgba(226, 125, 141, 0.22);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .phone-status-bar {
      height: 52px; padding: 0 44px; display: flex; align-items: center; justify-content: center;
      background: #0E131C;
    }
    .dynamic-island { width: 170px; height: 32px; background: #000000; border-radius: 20px; }
    
    .phone-app-bar {
      height: 84px; padding: 0 44px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: #0E131C;
    }
    .brand-logo { font-family: 'Cinzel', serif; font-size: 40px; font-weight: 900; letter-spacing: 0.12em; color: #FFFFFF; display: flex; align-items: center; gap: 8px; }
    .brand-logo .dot { color: #D4AF37; }
    .appbar-bell { position: relative; display: flex; align-items: center; }
    .bell-badge {
      position: absolute; top: -6px; right: -8px; width: 22px; height: 22px;
      background: #E11D48; border-radius: 50%; color: #FFFFFF;
      font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      border: 2px solid #0E131C;
    }
    
    /* Discovery Card */
    .discovery-card-wrapper { flex: 1; padding: 24px 34px 16px; display: flex; flex-direction: column; }
    .candidate-card {
      flex: 1; border-radius: 46px; overflow: hidden; position: relative;
      border: 1.5px solid rgba(212, 175, 55, 0.35); box-shadow: 0 25px 50px rgba(0,0,0,0.85);
      background: #121721;
    }
    .candidate-photo {
      width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block;
    }
    .card-vignette {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.45) 70%, #0B0E14 98%);
    }
    .card-top-row {
      position: absolute; top: 26px; right: 26px; z-index: 5;
    }
    .pill-badge.trust-gold {
      background: #D4AF37; color: #0B0E14; border: none; font-weight: 900; letter-spacing: 0.05em;
      font-size: 20px; padding: 9px 22px; border-radius: 9999px;
      display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    }
    
    .card-bottom-info {
      position: absolute; bottom: 32px; left: 36px; right: 36px; z-index: 5;
    }
    .candidate-name {
      font-size: 46px; font-weight: 800; color: #FFFFFF; display: flex; align-items: center; gap: 14px;
      font-family: 'Playfair Display', serif; margin-bottom: 10px;
    }
    .verified-icon { width: 34px; height: 34px; border-radius: 50%; background: #D4AF37; display: inline-flex; align-items: center; justify-content: center; color: #000; font-size: 22px; font-weight: 900; }
    .candidate-sub { font-size: 25px; color: #E2E8F0; font-weight: 600; display: flex; align-items: center; gap: 10px; }

    /* Action Buttons Row: TWO PILL BUTTONS (Pass & Connect) */
    .action-row {
      height: 125px; padding: 0 34px; display: flex; align-items: center; justify-content: space-between; gap: 22px;
    }
    .btn-pill-pass {
      flex: 1; height: 86px; border-radius: 9999px;
      background: #191E2E; border: 1.5px solid #374151;
      color: #FFFFFF; font-size: 32px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .btn-pill-connect {
      flex: 1.35; height: 86px; border-radius: 9999px;
      background: linear-gradient(90deg, #E27D8D, #9353D3);
      color: #FFFFFF; font-size: 32px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      box-shadow: 0 8px 25px rgba(226, 125, 141, 0.45);
    }
    .btn-pill-connect svg { width: 30px; height: 30px; fill: none; stroke: #FFFFFF; stroke-width: 2.4; }

    .phone-bottom-nav {
      height: 115px; background: #0C1017; border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: space-around; padding: 0 20px 10px;
    }
    .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748B; font-size: 19px; font-weight: 700; }
    .nav-tab.active { color: #E5C378; }
  </style>
</head>
<body>
  <div class="ambient-glow-top"></div>

  <div class="phone-container">
    <div class="phone-status-bar">
      <div class="dynamic-island"></div>
    </div>

    <div class="phone-app-bar">
      <div class="brand-logo">KNOT<span class="dot">.</span></div>
      <div class="appbar-bell">
        <svg viewBox="0 0 24 24" style="width: 34px; height: 34px; fill: #D4AF37;"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
        <span class="bell-badge">3</span>
      </div>
    </div>

    <div class="discovery-card-wrapper">
      <div class="candidate-card">
        <img class="candidate-photo" src="file:///C:/Users/PC/Documents/knot/mobile-flutter/assets/images/welcome_male.jpg" alt="Michael">
        <div class="card-vignette"></div>

        <div class="card-top-row">
          <div class="pill-badge trust-gold">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #0B0E14;"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            <span>TRUST 98%</span>
          </div>
        </div>

        <div class="card-bottom-info">
          <div class="candidate-name">
            Michael, 30
            <span class="verified-icon">✓</span>
          </div>
          <div class="candidate-sub">💼 Engineer • 📍 San Francisco, USA</div>
        </div>
      </div>
    </div>

    <!-- Live Two Pill Buttons: Pass and Connect -->
    <div class="action-row">
      <div class="btn-pill-pass">Pass</div>
      <div class="btn-pill-connect">
        <span>Connect</span>
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
    </div>

    <div class="phone-bottom-nav">
      <div class="nav-tab active"><span>♥</span><span>MATCHES</span></div>
      <div class="nav-tab"><span>⚡</span><span>INSIGHTS</span></div>
      <div class="nav-tab"><span>✦</span><span>AI COACH</span></div>
      <div class="nav-tab"><span>💬</span><span>MESSAGES</span></div>
      <div class="nav-tab"><span>👤</span><span>PROFILE</span></div>
    </div>
  </div>
</body>
</html>
