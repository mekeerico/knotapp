name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm ci
        working-directory: mobile

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        working-directory: mobile/android

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload.keystore
          else
            echo "No keystore secret found. Build will fall back to debug signing."
          fi
        working-directory: mobile

      - name: Build Release APK
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGNING_FLAGS=""
          if [ -f "app/upload.keystore" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            SIGNING_FLAGS="-PMYAPP_UPLOAD_STORE_FILE=upload.keystore -PMYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD -PMYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS -PMYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          fi
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" --max-workers=2 -PreactNativeArchitectures=arm64-v8a $SIGNING_FLAGS --no-daemon
        working-directory: mobile/android

      - name: Build Release AAB
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGNING_FLAGS=""
          if [ -f "app/upload.keystore" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            SIGNING_FLAGS="-PMYAPP_UPLOAD_STORE_FILE=upload.keystore -PMYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD -PMYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS -PMYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          fi
          ./gradlew bundleRelease -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" --max-workers=2 -PreactNativeArchitectures=arm64-v8a $SIGNING_FLAGS --no-daemon
        working-directory: mobile/android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knot-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knot-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
