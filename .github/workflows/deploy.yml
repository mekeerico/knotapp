name: Deploy to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend-core/**'
      - 'backend-ai/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deployment Archive
        run: |
          # Create a dedicated directory for the archive to prevent read errors
          mkdir -p build_archive
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./backend-core/node_modules' --exclude='./backend-ai/node_modules' --exclude='./frontend/node_modules' --exclude='./mobile/node_modules' --exclude='./mobile-flutter/.dart_tool' --exclude='./mobile-flutter/build' --exclude='./build_archive' -czf build_archive/knot-deploy.tar.gz .

      - name: Copy Archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build_archive/knot-deploy.tar.gz"
          target: "~/"
          strip_components: 1
          timeout: 120s
          command_timeout: 10m

      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            echo "Starting Deployment..."
            
            # Unpack the new code
            mkdir -p ~/knot
            tar -xzf ~/knot-deploy.tar.gz -C ~/knot
            cd ~/knot
            
            # Create production .env file
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # Restart Docker containers
            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d --build
            
            echo "Deployment Successful!"
