name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get
        working-directory: mobile-flutter

      - name: Build APK and App Bundle (AAB)
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=API_URL=http://knotconnect.duckdns.org:8080
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/knot-app.apk
          flutter build appbundle --release --no-tree-shake-icons --dart-define=API_URL=http://knotconnect.duckdns.org:8080
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/knot-app.aab
        working-directory: mobile-flutter

      - name: Upload Knot Release Binaries (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: knot-release-binaries
          path: |
            mobile-flutter/build/app/outputs/flutter-apk/knot-app.apk
            mobile-flutter/build/app/outputs/bundle/release/knot-app.aab
          retention-days: 14
