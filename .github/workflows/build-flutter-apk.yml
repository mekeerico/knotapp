          if keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$KP" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /tmp/kt_key.log 2>&1; then
            :
          elif keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$SP" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /tmp/kt_key.log 2>&1; then
            KP="$SP"
          else
            echo "::error::ANDROID_KEY_PASSWORD does not unlock key '$KA'."
            sed 's/^/  keytool: /' /tmp/kt_key.log | head -5
            exit 1
          fi
          rm -f /tmp/verify.p12

          EXPECTED_SHA1="8D:AE:D2:FA:5C:FB:67:7C:45:13:D8:07:22:D9:EB:1F:B7:93:92:05"
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/upload.keystore -storepass "$SP" -alias "$KA" | grep -m1 'SHA1:' | awk '{print $2}')
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Keystore SHA1 $ACTUAL_SHA1 does not match the Play Console upload key $EXPECTED_SHA1."
            exit 1
          fi

          {
            echo "storeFile=upload.keystore"
            echo "storePassword=$SP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } > android/key.properties
          echo "Upload key fingerprint matches Play Console ($EXPECTED_SHA1)."
        working-directory: mobile-flutter

      - name: Build Release APK
        run: |
          echo "Starting APK release compilation with parallel execution and Gradle cache..."
          flutter build apk --release --no-tree-shake-icons --dart-define=API_URL=http://knotconnect.duckdns.org:8080
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/knot-app.apk
          echo "APK build completed successfully."
        working-directory: mobile-flutter

      - name: Upload Knot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knot-app-release-apk
          path: mobile-flutter/build/app/outputs/flutter-apk/knot-app.apk
          retention-days: 30
