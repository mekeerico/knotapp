name: Build Flutter Android APK & AAB Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build:
    name: Build Flutter APK & AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get
        working-directory: mobile-flutter

      - name: Configure Keystore Signing (if valid secret provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload.keystore || true
            rm -f /tmp/verify.p12
            if keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt >/dev/null 2>&1; then
              echo "storeFile=upload.keystore" > android/key.properties
              echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
              echo "keyAlias=$KEY_ALIAS" >> android/key.properties
              echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
              echo "Verified release keystore with KEY_PASSWORD."
            elif keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEYSTORE_PASSWORD" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt >/dev/null 2>&1; then
              echo "storeFile=upload.keystore" > android/key.properties
              echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
              echo "keyAlias=$KEY_ALIAS" >> android/key.properties
              echo "keyPassword=$KEYSTORE_PASSWORD" >> android/key.properties
              echo "Verified release keystore using KEYSTORE_PASSWORD as keyPassword."
            else
              echo "Warning: Keystore secret or password mismatch. Falling back to default signing."
              rm -f android/app/upload.keystore android/key.properties
            fi
            rm -f /tmp/verify.p12
          else
            echo "No keystore secrets configured. Using default signing."
          fi
        working-directory: mobile-flutter

      - name: Build Android App Bundle (AAB) for Play Store
        run: |
          flutter build appbundle --release --no-tree-shake-icons --dart-define=API_URL=http://knotconnect.duckdns.org:8080
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/knot-app-release.aab
        working-directory: mobile-flutter

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=API_URL=http://knotconnect.duckdns.org:8080
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/knot-app.apk
        working-directory: mobile-flutter

      - name: Upload Knot AAB Artifact (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: knot-app-bundle-aab
          path: mobile-flutter/build/app/outputs/bundle/release/knot-app-release.aab
          retention-days: 30

      - name: Upload Knot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knot-app-release-apk
          path: mobile-flutter/build/app/outputs/flutter-apk/knot-app.apk
          retention-days: 30
