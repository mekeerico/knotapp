        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get
        working-directory: mobile-flutter

      - name: Configure Keystore Signing (if valid secret provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          # Strip any accidental spaces / newlines / CRs pasted into the secrets
          B64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          SP=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          KA=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KP=$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')
          [ -z "$KP" ] && KP="$SP"

          echo "Secret diagnostics (lengths only, values hidden):"
          echo "  ANDROID_KEYSTORE_BASE64 length: ${#B64} (expected 2928)"
          echo "  ANDROID_KEYSTORE_PASSWORD length: ${#SP} (expected 32)"
          echo "  ANDROID_KEY_ALIAS length: ${#KA} (expected 32)"
          echo "  ANDROID_KEY_PASSWORD length: ${#KP} (expected 32)"

          if [ -z "$B64" ] || [ -z "$SP" ] || [ -z "$KA" ]; then
            echo "::error::Release keystore secrets are not configured. Refusing to build an unsigned/debug-signed release."
            exit 1
          fi

          printf '%s' "$B64" | base64 --decode > android/app/upload.keystore
          echo "  Decoded keystore size: $(stat -c%s android/app/upload.keystore) bytes (expected 2195)"

          if ! keytool -list -keystore android/app/upload.keystore -storepass "$SP" > /tmp/kt_store.log 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore (or ANDROID_KEYSTORE_BASE64 is not the right file)."
            sed 's/^/  keytool: /' /tmp/kt_store.log | head -5
            exit 1
          fi
          echo "  Keystore password OK. Aliases in keystore:"
          grep -i 'PrivateKeyEntry' /tmp/kt_store.log | sed 's/^/    /'

