name: Build Flutter Android APK & AAB Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build-aab:
    name: Build Play Store Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get
        working-directory: mobile-flutter

      - name: Configure Keystore Signing (if valid secret provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          # Strip any accidental spaces / newlines / CRs pasted into the secrets
          B64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          SP=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          KA=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KP=$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')
          [ -z "$KP" ] && KP="$SP"

          echo "Secret diagnostics (lengths only, values hidden):"
          echo "  ANDROID_KEYSTORE_BASE64 length: ${#B64} (expected 2928)"
          echo "  ANDROID_KEYSTORE_PASSWORD length: ${#SP} (expected 32)"
          echo "  ANDROID_KEY_ALIAS length: ${#KA} (expected 32)"
          echo "  ANDROID_KEY_PASSWORD length: ${#KP} (expected 32)"

          if [ -z "$B64" ] || [ -z "$SP" ] || [ -z "$KA" ]; then
            echo "::error::Release keystore secrets are not configured. Refusing to build an unsigned/debug-signed release."
            exit 1
          fi

          printf '%s' "$B64" | base64 --decode > android/app/upload.keystore
          echo "  Decoded keystore size: $(stat -c%s android/app/upload.keystore) bytes (expected 2195)"

          EXPECTED_FILE_SHA="a0d7687698e6f34ad396a9c4556c7cdfa21d814cd4850347096b162d40a023d8"
          ACTUAL_FILE_SHA=$(sha256sum android/app/upload.keystore | awk '{print $1}')
          if [ "$ACTUAL_FILE_SHA" = "$EXPECTED_FILE_SHA" ]; then
            echo "  ANDROID_KEYSTORE_BASE64: OK (correct keystore file)"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 decodes to a different file than the Play Store keystore."
            exit 1
          fi

          # The three 32-char secrets may have been pasted into the wrong boxes. Try every arrangement.
          names=(ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          vals=("$SP" "$KA" "$KP")
          FOUND=""
          for i in 0 1 2; do
            if keytool -list -keystore android/app/upload.keystore -storepass "${vals[$i]}" > /tmp/kt_store.log 2>&1; then
              SP="${vals[$i]}"
              echo "  Keystore password found in secret: ${names[$i]}"
              [ "$i" != "0" ] && echo "::warning::The keystore password is stored in ${names[$i]} instead of ANDROID_KEYSTORE_PASSWORD."
              FOUND=1
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::None of ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD opens the keystore. Re-paste the Keystore password (99cc9e3c...)."
            sed 's/^/  keytool: /' /tmp/kt_store.log | head -3
            exit 1
          fi

          # Use the real alias from the keystore (there is only one key entry)
          REAL_ALIAS=$(keytool -list -keystore android/app/upload.keystore -storepass "$SP" 2>/dev/null | grep -i 'PrivateKeyEntry' | head -1 | cut -d',' -f1 | tr -d '[:space:]')
          if [ -n "$REAL_ALIAS" ] && [ "$REAL_ALIAS" != "$KA" ]; then
            echo "::warning::ANDROID_KEY_ALIAS does not match the keystore; using the alias found inside the keystore instead."
          fi
          [ -n "$REAL_ALIAS" ] && KA="$REAL_ALIAS"
          echo "  Using key alias: $KA"

          # Find the key password among the three values too
          for v in "${vals[@]}"; do
            rm -f /tmp/verify.p12
            if keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$v" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /dev/null 2>&1; then
              KP="$v"
              break
            fi
          done

          rm -f /tmp/verify.p12
          if keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$KP" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /tmp/kt_key.log 2>&1; then
            :
          elif keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$SP" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /tmp/kt_key.log 2>&1; then
            KP="$SP"
          else
            echo "::error::ANDROID_KEY_PASSWORD does not unlock key '$KA'."
            sed 's/^/  keytool: /' /tmp/kt_key.log | head -5
            exit 1
          fi
          rm -f /tmp/verify.p12

          EXPECTED_SHA1="8D:AE:D2:FA:5C:FB:67:7C:45:13:D8:07:22:D9:EB:1F:B7:93:92:05"
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/upload.keystore -storepass "$SP" -alias "$KA" | grep -m1 'SHA1:' | awk '{print $2}')
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Keystore SHA1 $ACTUAL_SHA1 does not match the Play Console upload key $EXPECTED_SHA1."
            exit 1
          fi

          {
            echo "storeFile=upload.keystore"
            echo "storePassword=$SP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } > android/key.properties
          echo "Upload key fingerprint matches Play Console ($EXPECTED_SHA1)."
        working-directory: mobile-flutter

      - name: Build Android App Bundle (AAB) for Play Store
        run: |
          echo "Starting AAB release compilation with parallel execution and Gradle cache..."
          flutter build appbundle --release --no-tree-shake-icons --dart-define=API_URL=http://knotconnect.duckdns.org:8080
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/knot-app-release.aab
          echo "AAB build completed successfully."
        working-directory: mobile-flutter

      - name: Upload Knot AAB Artifact (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: knot-app-bundle-aab
          path: mobile-flutter/build/app/outputs/bundle/release/knot-app-release.aab
          retention-days: 30

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get
        working-directory: mobile-flutter

      - name: Configure Keystore Signing (if valid secret provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          # Strip any accidental spaces / newlines / CRs pasted into the secrets
          B64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          SP=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          KA=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KP=$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')
          [ -z "$KP" ] && KP="$SP"

          echo "Secret diagnostics (lengths only, values hidden):"
          echo "  ANDROID_KEYSTORE_BASE64 length: ${#B64} (expected 2928)"
          echo "  ANDROID_KEYSTORE_PASSWORD length: ${#SP} (expected 32)"
          echo "  ANDROID_KEY_ALIAS length: ${#KA} (expected 32)"
          echo "  ANDROID_KEY_PASSWORD length: ${#KP} (expected 32)"

          if [ -z "$B64" ] || [ -z "$SP" ] || [ -z "$KA" ]; then
            echo "::error::Release keystore secrets are not configured. Refusing to build an unsigned/debug-signed release."
            exit 1
          fi

          printf '%s' "$B64" | base64 --decode > android/app/upload.keystore
          echo "  Decoded keystore size: $(stat -c%s android/app/upload.keystore) bytes (expected 2195)"

          EXPECTED_FILE_SHA="a0d7687698e6f34ad396a9c4556c7cdfa21d814cd4850347096b162d40a023d8"
          ACTUAL_FILE_SHA=$(sha256sum android/app/upload.keystore | awk '{print $1}')
          if [ "$ACTUAL_FILE_SHA" = "$EXPECTED_FILE_SHA" ]; then
            echo "  ANDROID_KEYSTORE_BASE64: OK (correct keystore file)"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 decodes to a different file than the Play Store keystore."
            exit 1
          fi

          # The three 32-char secrets may have been pasted into the wrong boxes. Try every arrangement.
          names=(ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          vals=("$SP" "$KA" "$KP")
          FOUND=""
          for i in 0 1 2; do
            if keytool -list -keystore android/app/upload.keystore -storepass "${vals[$i]}" > /tmp/kt_store.log 2>&1; then
              SP="${vals[$i]}"
              echo "  Keystore password found in secret: ${names[$i]}"
              [ "$i" != "0" ] && echo "::warning::The keystore password is stored in ${names[$i]} instead of ANDROID_KEYSTORE_PASSWORD."
              FOUND=1
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::None of ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD opens the keystore. Re-paste the Keystore password (99cc9e3c...)."
            sed 's/^/  keytool: /' /tmp/kt_store.log | head -3
            exit 1
          fi

          # Use the real alias from the keystore (there is only one key entry)
          REAL_ALIAS=$(keytool -list -keystore android/app/upload.keystore -storepass "$SP" 2>/dev/null | grep -i 'PrivateKeyEntry' | head -1 | cut -d',' -f1 | tr -d '[:space:]')
          if [ -n "$REAL_ALIAS" ] && [ "$REAL_ALIAS" != "$KA" ]; then
            echo "::warning::ANDROID_KEY_ALIAS does not match the keystore; using the alias found inside the keystore instead."
          fi
          [ -n "$REAL_ALIAS" ] && KA="$REAL_ALIAS"
          echo "  Using key alias: $KA"

          # Find the key password among the three values too
          for v in "${vals[@]}"; do
            rm -f /tmp/verify.p12
            if keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$v" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /dev/null 2>&1; then
              KP="$v"
              break
            fi
          done

          rm -f /tmp/verify.p12
          if keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$KP" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /tmp/kt_key.log 2>&1; then
            :
          elif keytool -importkeystore -srckeystore android/app/upload.keystore -srcstorepass "$SP" -srcalias "$KA" -srckeypass "$SP" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass verify123 -destkeypass verify123 -noprompt > /tmp/kt_key.log 2>&1; then
            KP="$SP"
          else
            echo "::error::ANDROID_KEY_PASSWORD does not unlock key '$KA'."
            sed 's/^/  keytool: /' /tmp/kt_key.log | head -5
            exit 1
          fi
          rm -f /tmp/verify.p12

          EXPECTED_SHA1="8D:AE:D2:FA:5C:FB:67:7C:45:13:D8:07:22:D9:EB:1F:B7:93:92:05"
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/upload.keystore -storepass "$SP" -alias "$KA" | grep -m1 'SHA1:' | awk '{print $2}')
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
